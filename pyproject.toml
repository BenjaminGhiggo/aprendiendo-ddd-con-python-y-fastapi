[project]
name = "aprendiendo-ddd-con-python-y-fastapi"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Las carpetas de ejercicios tienen archivos de prueba con nombres repetidos
# (a propósito, para que cada ejercicio sea autocontenido). Se corren de forma
# individual apuntando a su carpeta; la corrida global del repo las omite.
norecursedirs = ["ejercicios"]
