[project]
name = "aprendiendo-ddd-con-python-y-fastapi"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
docs = [
    "mkdocs-material>=9.5,<10",
]

[tool.pytest.ini_options]
# Las carpetas de ejercicios tienen archivos de prueba con nombres repetidos
# (a propósito, para que cada ejercicio sea autocontenido). Se corren de forma
# individual apuntando a su carpeta; la corrida global del repo las omite.
norecursedirs = ["ejercicios", "paso6_ejercicios", "paso5_solucionario", ".venv", "node_modules"]
