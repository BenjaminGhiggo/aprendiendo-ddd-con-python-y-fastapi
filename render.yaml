# render.yaml — configuración de los dos servicios en Render (plan gratis).
# Los servicios se crearon con la API de Render usando exactamente esta configuración;
# este archivo la deja documentada en el repo. Detalle en despliegue/README.md.
services:
  # 1) Sitio de estudio: lecciones y capítulos navegables (MkDocs Material).
  - type: web
    name: aprendiendo-ddd-sitio
    runtime: static
    branch: ccr-b56bf27c-qa5zqh
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --only-group docs &&
      uv run --no-sync python despliegue/sitio/construir_sitio.py &&
      uv run --no-sync mkdocs build -f build/mkdocs.yml
    staticPublishPath: site
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

  # 2) API FastAPI del proyecto allocation (snapshot del Capítulo 13), con /docs.
  - type: web
    name: allocation-api
    runtime: python
    plan: free
    branch: ccr-b56bf27c-qa5zqh
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn main:app --app-dir despliegue/api --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
